name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version and npm dist-tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-beta.N" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          dist_tag="latest"
          if [[ "$version" == *-beta.* ]]; then
            dist_tag="beta"
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version
        run: npm pkg set "version=$VERSION"

      - name: Test
        run: pnpm test

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publish package
        run: npm publish --access public --tag "$NPM_DIST_TAG"
